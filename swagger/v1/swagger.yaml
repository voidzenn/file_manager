---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/auth/sign_up":
    post:
      summary: "/api/v1/auth/sign_up"
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                fname:
                  type: string
                lname:
                  type: string
              required:
              - email
              - password
              - fname
              - lname
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: 127.0.0.1
