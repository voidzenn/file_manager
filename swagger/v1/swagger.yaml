---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/auth/sign_up":
    post:
      summary: Sign Up
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success: true
                    data:
                      email: email@example.com
                      fname: John
                      lname: Doe
                    meta: {}
        '422':
          description: unprocessable_entity
          content:
            application/json:
              examples:
                parameter_missing:
                  value:
                    success: false
                    error:
                    - "<attribute_name>": cannot be blank
                email_invalid:
                  value:
                    success: false
                    error:
                    - email: is invalid
                email_exists:
                  value:
                    success: false
                    error: Parameter missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                    fname:
                      type: string
                    lname:
                      type: string
                required:
                - email
                - password
                - fname
                - lname
              require:
              - user
  "/api/v1/auth/sign_in":
    post:
      summary: Sign In
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: ok
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: 127.0.0.1
